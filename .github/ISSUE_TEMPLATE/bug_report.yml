name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please never include your VIN, GPS positions or raw logs with personal data.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Studio (editor, Windows or macOS)
        - Simulator
        - Theme compiler / validation
        - MGU app (on the car)
        - Themes
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: idv7lol version or commit
      placeholder: v0.1.0 or a commit hash
    validations:
      required: true
  - type: input
    id: car
    attributes:
      label: Car and head unit software (only for on-car issues)
      placeholder: e.g. G20 330e, iDrive 7, I-step 20w44.1-1-3, cluster-render 0.4.3
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open the theme … 2. Click … 3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include error messages from the Studio console or the compiler. Attach the theme file if you can.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: If a car was involved, it was parked and the factory cluster came back after deactivating idv7lol.
