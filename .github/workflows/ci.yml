name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Workflows get read-only tokens; nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Validate bundled themes
        run: npm run themes:validate
      - name: Build packages
        run: npm run build
      - name: Build Studio front end
        run: npm run build -w @idv7lol/studio

  car-node8:
    name: Car app on Node ${{ matrix.node }}
    # The head unit runs Node 8 (8.9.4 on 2019 units, 8.16.2 on newer firmware). The main suite
    # runs on Node 24, so the car's modules are also built and checked on both 8.x versions.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['8.9.4', '8.16.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: USB packages of every theme
        run: npx tsx tools/development/make-test-packages.ts "$RUNNER_TEMP/pkgs"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Build every theme with the car's engine
        run: node tools/development/car-node8-check.cjs "$RUNNER_TEMP/pkgs"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  studio-windows:
    name: Build Studio (Windows)
    # The desktop build is slow: run it for pushes to main and tags, and for PRs that touch the Studio.
    if: github.event_name == 'push' || contains(github.event.pull_request.title, 'studio')
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri
      - run: npm ci
      - name: Build Studio installer
        run: npm run tauri:build
      - name: Upload development artifacts
        uses: actions/upload-artifact@v4
        with:
          name: idv7lol-studio-windows
          path: |
            apps/studio/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14

  studio-macos:
    name: Build Studio (macOS)
    # One universal app for Apple silicon and Intel Macs. Signed ad hoc (no Apple certificate),
    # so macOS asks once before opening it; docs/user/INSTALL_MAC.md explains.
    if: github.event_name == 'push' || contains(github.event.pull_request.title, 'studio')
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri
      - run: npm ci
      - name: Build Studio app and disk image
        working-directory: apps/studio
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      - name: Check the app bundle
        run: |
          APP="apps/studio/src-tauri/target/universal-apple-darwin/release/bundle/macos/idv7lol Studio.app"
          lipo -archs "$APP/Contents/MacOS/"*
          codesign --verify --deep --verbose=2 "$APP"
          plutil -p "$APP/Contents/Info.plist" | grep -E 'CFBundleShortVersionString|LSMinimumSystemVersion|idv7theme'
      - name: Upload development artifacts
        uses: actions/upload-artifact@v4
        with:
          name: idv7lol-studio-macos
          path: |
            apps/studio/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
