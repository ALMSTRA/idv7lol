[package]
name = "idv7lol-studio"
version = "0.1.0"
description = "idv7lol Studio: visual editor, simulator and build tool for BMW iDrive 7 custom clusters"
authors = ["idv7lol contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/ALMSTRA/idv7lol"
edition = "2021"
rust-version = "1.77"

[lib]
name = "idv7lol_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
